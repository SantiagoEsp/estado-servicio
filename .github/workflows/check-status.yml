name: Verificar servicios

on:
  schedule:
    # Evita los minutos de mayor congestión de GitHub Actions.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

concurrency:
  group: service-status-check
  cancel-in-progress: false

jobs:
  check:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Preparar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Ejecutar pruebas
        run: npm run check

      - name: Verificar servicios
        id: monitor
        shell: bash
        env:
          MEETING_HEALTH_TOKEN: ${{ secrets.MEETING_HEALTH_TOKEN }}
        run: |
          result="$(node scripts/check-status.mjs)"
          echo "${result}"
          echo "persist=$(jq -r '.persistRecommended // false' <<<"${result}")" >> "${GITHUB_OUTPUT}"

      - name: Preparar sitio actualizado
        shell: bash
        run: |
          mkdir -p _site
          cp index.html robots.txt .nojekyll CNAME _site/
          cp -R assets data _site/

      - name: Subir sitio actualizado
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Publicar cambios de estado
        if: steps.monitor.outputs.persist == 'true'
        shell: bash
        run: |
          git config user.name "status-monitor[bot]"
          git config user.email "status-monitor[bot]@users.noreply.github.com"
          git add data/status.json data/incidents.json
          git commit -m "Actualizar estado del servicio"

          git push

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    needs: check
    steps:
      - name: Publicar estado en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
